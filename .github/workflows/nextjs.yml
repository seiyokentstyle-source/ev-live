name: Deploy Next.js site to Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/nextjs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 通常の1コミット更新は親までで十分。複数コミット/マージは下で
          # 比較範囲の完全性を検証し、不足する祖先だけ追加取得する。
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: 比較範囲の履歴を確認
        if: github.event_name == 'push'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "比較先が無いので深掘り不要（ブランチ新規作成など）"
            exit 0
          fi
          node scripts/ensure-comparison-history.mjs --base "$BASE_SHA"
      # データが巻き戻ったまま公開しないための関門。
      # data-guard は main への直接pushでも鳴るが、それ自体はデプロイを止められない
      # （別のワークフローなので）。実際 2026-08-26 に5機種で14〜26%減ったJSONが
      # data-guard 5連続failureのまま公開された。ここで同じ判定を通してから出す。
      - name: データ巻き戻りチェック（赤ければ公開しない）
        if: github.event_name == 'push'
        working-directory: .
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "比較先が無いので見送ります（ブランチ新規作成など）"
            exit 0
          fi
          node scripts/check-data-regression.mjs --base "$before"
      - name: Install dependencies
        run: npm ci
      - name: Test data guard and history boundaries
        run: node --test ../scripts/tests/*.test.mjs
      - name: Test site
        run: npm test
      - name: Build (static export under basePath /ev-live)
        run: npm run build
        env:
          PAGES_BASE_PATH: /ev-live
          STATIC_EXPORT: "true"
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/out
