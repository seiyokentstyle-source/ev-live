name: Deploy Next.js site to Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - ".github/workflows/nextjs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ★全履歴は6.8GBある。data/machines/*.json を毎晩まるごと書き直し、
          #   1機種1コミットで1日40〜70件入るため。毎回引くとCheckoutだけで数分かかる。
          #   巻き戻りチェックに要るのは比較先の1コミットだけ。しかもサイトセブンが
          #   出すのは7日ぶんで、それより前のデータは取り直せない＝変わりようがない。
          #   次のステップで8日窓だけ深める（実測 6.8GB → 0.1GB / 261コミット）。
          fetch-depth: 1
      # 浅いcloneのままだと比較先を解決できず、下の関門が素通りして公開されてしまう。
      # 必要なぶんだけ深め、それでも解決できなければ落とす（見送らない）。
      - name: 比較先の履歴だけ取る
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "比較先が無いので深掘り不要（ブランチ新規作成など）"
            exit 0
          fi
          git fetch --shallow-since="8 days ago" origin main || true
          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "比較先が8日窓の外にある。深く取り直します"
            git fetch --deepen=1000 origin main || git fetch --unshallow origin main
          fi
          # ここで解決できないまま進むと比較なしで公開される。必ず落とす。
          git cat-file -e "${before}^{commit}"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      # データが巻き戻ったまま公開しないための関門。
      # data-guard は main への直接pushでも鳴るが、それ自体はデプロイを止められない
      # （別のワークフローなので）。実際 2026-08-26 に5機種で14〜26%減ったJSONが
      # data-guard 5連続failureのまま公開された。ここで同じ判定を通してから出す。
      - name: データ巻き戻りチェック（赤ければ公開しない）
        if: github.event_name == 'push'
        working-directory: .
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "比較先が無いので見送ります（ブランチ新規作成など）"
            exit 0
          fi
          node scripts/check-data-regression.mjs --base "$before"
      - name: Install dependencies
        run: npm ci
      - name: Build (static export under basePath /ev-live)
        run: npm run build
        env:
          PAGES_BASE_PATH: /ev-live
          STATIC_EXPORT: "true"
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/out
